name: Sync WC scores (football-data)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = solo marcadores (ventana +2h); full = upsert completo WC (equipos + partidos, p.ej. tras cerrar una fase)"
        required: false
        default: incremental
        type: choice
        options:
          - incremental
          - full

concurrency:
  group: sync-wc-scores
  cancel-in-progress: false

jobs:
  sync:
    name: WC match sync (football-data)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Sync WC from football-data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
            pnpm football-data:sync:wc:full
          else
            pnpm football-data:sync:wc
          fi
